<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="mainmenu-wrapper">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="mainmenu-card text-center p-4">
                <h2 class="mainmenu-card-title mb-4">Tic Tac Toe</h2>

                <div id="status" class="mb-3 text-info fw-bold">Player X's Turn</div>

                <div class="mainmenu-ttt-grid">
                    <div class="mainmenu-ttt-cell" onclick="makeTTTMove(this, 0)"></div>
                    <div class="mainmenu-ttt-cell" onclick="makeTTTMove(this, 1)"></div>
                    <div class="mainmenu-ttt-cell" onclick="makeTTTMove(this, 2)"></div>
                    <div class="mainmenu-ttt-cell" onclick="makeTTTMove(this, 3)"></div>
                    <div class="mainmenu-ttt-cell" onclick="makeTTTMove(this, 4)"></div>
                    <div class="mainmenu-ttt-cell" onclick="makeTTTMove(this, 5)"></div>
                    <div class="mainmenu-ttt-cell" onclick="makeTTTMove(this, 6)"></div>
                    <div class="mainmenu-ttt-cell" onclick="makeTTTMove(this, 7)"></div>
                    <div class="mainmenu-ttt-cell" onclick="makeTTTMove(this, 8)"></div>
                </div>

                <button class="btn btn-outline-light mt-4 px-4" onclick="resetTTT()">Restart Game</button>

                <div class="mt-4">
                    <a href="/" class="mainmenu-btn-play text-decoration-none">
                        <i class="fa-solid fa-house me-2"></i> Back to Menu
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/script.js"></script>
</body>
</html>
