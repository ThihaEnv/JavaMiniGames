<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Wheel - Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="mainmenu-wrapper">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="mainmenu-card text-center p-5">
                <h2 class="mainmenu-card-title mb-4">Random Wheel</h2>

                <div class="wheel-container mb-5">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                </div>

                <div class="input-group mb-3">
                    <input type="text" id="nameInput" class="form-control bg-dark text-white border-secondary" placeholder="နာမည်ထည့်ပါ...">
                    <button class="btn btn-primary" onclick="addName()">Add</button>
                </div>

                <div id="namesList" class="mb-4 text-muted small"></div>

                <button class="btn btn-warning btn-lg px-5 fw-bold" id="spinBtn" onclick="spinWheel()">SPIN NOW</button>

                <div class="mt-4">
                    <a href="/" class="mainmenu-btn-play text-decoration-none">
                        <i class="fa-solid fa-house me-2"></i> Back to Menu
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/script.js"></script>
</body>
</html>
