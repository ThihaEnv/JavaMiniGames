<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Mini Games Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="mainmenu-wrapper">

<div class="container py-5">
    <header class="text-center mb-5">
        <h1 class="mainmenu-header-title">Mini Games Hub</h1>
        <p class="mainmenu-header-subtitle">Choose your challenge</p>
    </header>

    <div class="row g-4 justify-content-center">
        <div class="col-md-4">
            <a href="/rock-paper-scissors" class="text-decoration-none">
                <div class="mainmenu-card">
                    <div class="mainmenu-card-icon mainmenu-bg-blue">
                        <i class="fa-solid fa-hand-back-fist"></i>
                    </div>
                    <h3 class="mainmenu-card-title text-white">Rock Paper Scissors</h3>
                    <p class="mainmenu-card-desc">Face off against the computer in a classic duel.</p>
                    <span class="mainmenu-btn-play">Play Now <i class="fa-solid fa-arrow-right"></i></span>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/random-wheel" class="text-decoration-none">
                <div class="mainmenu-card">
                    <div class="mainmenu-card-icon mainmenu-bg-amber">
                        <i class="fa-solid fa-dharmachakra"></i>
                    </div>
                    <h3 class="mainmenu-card-title text-white">Random Wheel</h3>
                    <p class="mainmenu-card-desc">Spin the wheel of fortune and let fate decide.</p>
                    <span class="mainmenu-btn-play">Play Now <i class="fa-solid fa-arrow-right"></i></span>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/tic-tac-toe" class="text-decoration-none">
                <div class="mainmenu-card">
                    <div class="mainmenu-card-icon mainmenu-bg-rose">
                        <i class="fa-solid fa-xmark"></i>
                    </div>
                    <h3 class="mainmenu-card-title text-white">Tic Tac Toe</h3>
                    <p class="mainmenu-card-desc">The ultimate strategy test for quick thinkers.</p>
                    <span class="mainmenu-btn-play">Play Now <i class="fa-solid fa-arrow-right"></i></span>
                </div>
            </a>
        </div>
    </div>
</div>

</body>
</html>
